# AMCL 대신 slam_toolbox pose-graph 기반 위치추정을 쓸 때.
# 희박한 스캔에서 AMCL 이 잘 수렴하지 않으면 이쪽을 시도.
# map_file_name 을 실제 맵 이름으로 수정할 것.
slam_toolbox:
  ros__parameters:
    mode: localization
    map_file_name: /home/unitree/maps/office
    map_start_at_dock: false
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    resolution: 0.05
    max_laser_range: 10.0
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    transform_timeout: 0.4
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    do_loop_closing: true
    loop_match_minimum_chain_size: 3
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    correlation_search_space_dimension: 0.7
